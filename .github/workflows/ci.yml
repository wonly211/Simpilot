name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Run fixed CI pipeline
        shell: pwsh
        run: ./tools/ci.ps1

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Simpilot-${{ github.sha }}-win-x64
          path: |
            build/ci-vs2022-x64/Simpilot-*-win-x64.zip
            build/ci-vs2022-x64/Simpilot-*-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
