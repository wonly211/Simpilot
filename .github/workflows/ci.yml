name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Run fixed CI pipeline
        shell: pwsh
        run: ./tools/ci.ps1

      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Simpilot-${{ github.sha }}-win-x64
          path: |
            build/ci-vs2022-x64/Simpilot-*-win-x64.zip
            build/ci-vs2022-x64/Simpilot-*-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
