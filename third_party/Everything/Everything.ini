; Portable defaults distributed with Simpilot.
; Runtime state and the Everything database stay in this directory.
[Everything]
run_as_admin=0
run_in_background=1
show_in_taskbar=1
show_tray_icon=0
allow_multiple_windows=0
allow_multiple_instances=0
check_for_updates_on_startup=0
beta_updates=0
ipc=1
search_history_enabled=0
run_history_enabled=1
auto_include_fixed_volumes=1
auto_include_removable_volumes=0
exclude_hidden_files_and_folders=0
exclude_system_files_and_folders=0
